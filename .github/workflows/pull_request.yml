name: CI

on: [pull_request]

jobs:
  bats:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout (with bats submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install jq and bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq bats

      - name: Install jq and bats (macOS)
        if: runner.os == 'macOS'
        run: brew install jq bats-core

      - name: Run tests
        run: bats tests/

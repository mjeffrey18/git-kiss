name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # shellcheck is preinstalled on ubuntu-latest runners.
      - name: Check shell syntax
        run: bash -n bin/gk install.sh

      - name: Run shellcheck
        run: shellcheck -x bin/gk install.sh

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

  bats:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout (with bats submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install jq and bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y expect jq bats

      - name: Install jq and bats (macOS)
        if: runner.os == 'macOS'
        run: brew install jq bats-core

      - name: Run tests
        env:
          HOME: ${{ runner.temp }}/gk-home
          GK_NO_VERSION_CHECK: "1"
        run: bats tests/
